<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WebUI — Modular Control Panel</title>
  <style>
    /* -------- DESIGN SYSTEM (unchanged original) -------- */
    :root{
      --bg: #0a0b12;
      --panel: #12131f;
      --panel-2: #161827;
      --border: rgba(255,255,255,0.06);
      --border-soft: rgba(255,255,255,0.04);
      --text: #eef0f7;
      --text-dim: #8b8da3;
      --text-faint: #5e6079;
      --accent: #7c5cff;
      --accent-2: #9d7bff;
      --accent-soft: rgba(124,92,255,0.14);
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --blue: #60a5fa;
      --radius: 12px;
      --sidebar-w: 264px;
      --sidebar-w-collapsed: 76px;
    }
    *{ margin:0; padding:0; box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', -apple-system, Roboto, sans-serif;
      display:flex;
      min-height:100vh;
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background: radial-gradient(circle at 15% 0%, rgba(124,92,255,0.07), transparent 40%),
                  radial-gradient(circle at 85% 100%, rgba(96,165,250,0.05), transparent 40%);
      pointer-events:none;
      z-index:0;
    }
    /* Sidebar */
    .sidebar{
      width: var(--sidebar-w);
      min-height:100vh;
      background: var(--panel);
      border-right:1px solid var(--border);
      display:flex;
      flex-direction:column;
      padding:18px 14px;
      position:sticky;
      top:0;
      height:100vh;
      transition: width 0.22s ease, padding 0.22s ease;
      z-index:10;
      flex-shrink:0;
    }
    .sidebar.collapsed{ width: var(--sidebar-w-collapsed); padding:18px 10px; }
    .sidebar-top{ display:flex; align-items:center; justify-content:space-between; padding:6px 6px 22px 6px; gap:8px; }
    .logo{ display:flex; align-items:center; gap:11px; min-width:0; overflow:hidden; }
    .logo-icon{
      width:34px; height:34px; border-radius:9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 16px rgba(124,92,255,0.35);
      flex-shrink:0;
    }
    .logo-icon svg{ width:18px; height:18px; }
    .logo-text{ font-size:17px; font-weight:700; white-space:nowrap; transition:opacity 0.15s; }
    .sidebar.collapsed .logo-text,
    .sidebar.collapsed .sidebar-label,
    .sidebar.collapsed .status-card,
    .sidebar.collapsed .user-info,
    .sidebar.collapsed .chevron-user{ opacity:0; width:0; pointer-events:none; }
    .collapse-btn{
      width:28px; height:28px; border-radius:8px; border:1px solid var(--border);
      background:transparent; color:var(--text-dim); display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition: all 0.15s;
    }
    .collapse-btn:hover{ background:var(--panel-2); color:var(--text); }
    .sidebar.collapsed .collapse-btn svg{ transform:rotate(180deg); }
    .sidebar.collapsed .sidebar-top{ justify-content:center; }
    .sidebar.collapsed .logo{ display:none; }

    /* navigation */
    .nav{ display:flex; flex-direction:column; gap:3px; }
    .nav-item{
      display:flex; align-items:center; gap:13px; padding:10px 12px; border-radius:9px;
      color:var(--text-dim); text-decoration:none; font-size:14px; font-weight:500;
      cursor:pointer; white-space:nowrap; transition: all 0.15s;
    }
    .nav-item svg{ width:18px; height:18px; flex-shrink:0; stroke:currentColor; }
    .nav-item:hover{ background:rgba(255,255,255,0.035); color:var(--text); }
    .nav-item.active{ background: var(--accent-soft); color:#fff; box-shadow: inset 0 0 0 1px rgba(124,92,255,0.28); }
    .sidebar.collapsed .nav-item{ justify-content:center; padding:10px; }
    .nav-spacer{ flex:1; }
    .status-card{
      background: var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
      padding:14px; margin-top:18px;
    }
    .status-title{ font-size:13px; font-weight:600; margin-bottom:5px; }
    .status-sub{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-dim); margin-bottom:14px; }
    .status-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green); }
    .stat-row{ margin-bottom:10px; }
    .stat-label-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:5px; }
    .stat-value{ color:var(--text); font-weight:600; }
    .progress-track{ width:100%; height:5px; background:rgba(255,255,255,0.06); border-radius:4px; overflow:hidden; }
    .progress-fill{ height:100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition:width 0.6s ease; }
    .user-card{
      display:flex; align-items:center; gap:11px; padding-top:14px; margin-top:14px;
      border-top:1px solid var(--border); cursor:pointer;
    }
    .avatar{
      width:36px; height:36px; border-radius:50%;
      background: linear-gradient(135deg, var(--accent), #5b8def);
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:700; font-size:14px; flex-shrink:0;
    }
    .user-info{ display:flex; flex-direction:column; overflow:hidden; white-space:nowrap; }
    .user-name{ font-size:13.5px; font-weight:600; }
    .user-role{ font-size:11.5px; color:var(--text-dim); }
    /* main */
    .main{ flex:1; min-width:0; position:relative; z-index:1; }
    .topbar{
      display:flex; align-items:center; justify-content:space-between; padding:20px 32px;
      border-bottom:1px solid var(--border); background:rgba(10,11,18,0.85);
      backdrop-filter:blur(10px); position:sticky; top:0; z-index:5;
    }
    .page{ padding:28px 32px; display:none; }
    .page.active{ display:block; animation:fadeIn 0.25s ease; }
    @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
    /* grid, cards, buttons, tables etc (rest of original CSS) */
    .grid{ display:grid; gap:18px; }
    .grid-4{ grid-template-columns:repeat(4,1fr); }
    .grid-2{ grid-template-columns:repeat(2,1fr); }
    .grid-3{ grid-template-columns:repeat(3,1fr); }
    @media (max-width:1100px){ .grid-4{ grid-template-columns:repeat(2,1fr); } .grid-3{ grid-template-columns:repeat(2,1fr);} }
    @media (max-width:680px){ .grid-4,.grid-3,.grid-2{ grid-template-columns:1fr; } }
    .card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
    .card-title{ font-size:14px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; }
    .kpi{ display:flex; flex-direction:column; gap:8px; }
    .kpi-icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent-2); margin-bottom:6px; }
    .kpi-value{ font-size:26px; font-weight:700; letter-spacing:-0.5px; }
    .btn{
      display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:9px;
      border:1px solid var(--border); background:var(--panel-2); color:var(--text);
      font-size:13px; font-weight:600; cursor:pointer; transition:0.15s;
    }
    .btn-primary{ background: linear-gradient(135deg, var(--accent), #6b4cf5); border-color:transparent; color:#fff; box-shadow:0 4px 16px rgba(124,92,255,0.25); }
    .btn-danger{ border-color:rgba(248,113,113,0.3); color:var(--red); background:rgba(248,113,113,0.08); }
    .btn-sm{ padding:6px 11px; font-size:12px; }
    .pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:99px; font-size:11.5px; font-weight:600; }
    .pill.online{ background:rgba(52,211,153,0.12); color:var(--green); }
    .pill.idle{ background:rgba(251,191,36,0.12); color:var(--yellow); }
    .pill.offline{ background:rgba(248,113,113,0.12); color:var(--red); }
    .chat-layout{ display:grid; grid-template-columns:260px 1fr; gap:18px; height:calc(100vh - 165px); }
    @media (max-width:900px){ .chat-layout{ grid-template-columns:1fr; } }
    .toast-wrap{ position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:10px; z-index:200; }
    .toast{ background:var(--panel-2); border-left:3px solid var(--accent); padding:12px 16px; border-radius:9px; animation:toastIn 0.25s ease; }
    .modal-overlay{ position:fixed; inset:0; background:rgba(5,6,12,0.6); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:100; }
    .modal-overlay.open{ display:flex; }
    .modal{ background:var(--panel-2); border-radius:14px; padding:24px; width:100%; max-width:420px; }
    .toggle{ position:relative; display:inline-block; width:42px; height:24px; }
    .toggle-slider{ position:absolute; cursor:pointer; inset:0; background:var(--panel-2); border-radius:99px; transition:0.2s; }
    .toggle-slider:before{ content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:var(--text-dim); border-radius:50%; transition:0.2s; }
    .toggle input:checked + .toggle-slider{ background:var(--accent); }
    .toggle input:checked + .toggle-slider:before{ transform:translateX(18px); background:#fff; }
    .empty-state{ text-align:center; padding:48px 20px; color:var(--text-dim); }
    @media (max-width:760px){ .sidebar{ position:fixed; left:0; top:0; transform:translateX(-100%); transition:0.25s; box-shadow:0 0 40px rgba(0,0,0,0.5); } .sidebar.mobile-open{ transform:translateX(0); } .mobile-menu-btn{ display:flex; } }
    .mobile-menu-btn{ display:none; }
  </style>
</head>

</main>

<div class="modal-overlay" id="userModal"><div class="modal"><h3 id="userModalTitle">Add user</h3><div class="field"><label>Full name</label><input id="modalUserName" placeholder="e.g. Jordan Lee"></div><div class="field"><label>Email</label><input id="modalUserEmail" placeholder="name@example.com"></div><div class="field"><label>Role</label><select id="modalUserRole"><option>Administrator</option><option>Moderator</option><option>Member</option></select></div><div class="field"><label>Status</label><select id="modalUserStatus"><option>Online</option><option>Idle</option><option>Offline</option></select></div><div class="modal-actions"><button class="btn" id="userModalCancel">Cancel</button><button class="btn btn-primary" id="userModalSave">Save</button></div></div></div>
<div class="modal-overlay" id="pluginModal"><div class="modal"><h3>Install plugin</h3><div class="field"><label>Plugin name</label><input id="modalPluginName" placeholder="e.g. Translator Pro"></div><div class="field"><label>Author</label><input id="modalPluginAuthor"></div><div class="field"><label>Description</label><textarea id="modalPluginDesc" rows="3"></textarea></div><div class="modal-actions"><button class="btn" id="pluginModalCancel">Cancel</button><button class="btn btn-primary" id="pluginModalSave">Install</button></div></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
  // -------------------------- MODULAR STATE MANAGEMENT --------------------------
  class AppState {
    constructor(defaultData) {
      this.data = defaultData;
      this.subscribers = new Set();
    }
    subscribe(fn) { this.subscribers.add(fn); return () => this.subscribers.delete(fn); }
    notify() { this.subscribers.forEach(fn => fn(this.data)); this.persist(); }
    persist() { try { localStorage.setItem('webui_state_v2', JSON.stringify(this.data)); } catch(e) {} }
    loadPersisted(defaultFactory) {
      try { const raw = localStorage.getItem('webui_state_v2'); if(raw) { const parsed = JSON.parse(raw); this.data = { ...defaultFactory(), ...parsed }; } } catch(e){}
      this.notify();
    }
    update(updater) { updater(this.data); this.notify(); }
  }

  function generateInitialLogs() {
    const levels = ['INFO','WARN','ERROR','DEBUG'];
    const msgs = ['Model inference completed','High memory usage','Webhook retry','Cache invalidated','User login'];
    let out = [];
    for(let i=0;i<22;i++) out.push({time: new Date(Date.now()-i*3600000).toLocaleTimeString(), level: levels[i%4], msg: msgs[i%5]+` (${i})`});
    return out;

    .card-title{ font-size:14px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; }
    .kpi{ display:flex; flex-direction:column; gap:8px; }
    .kpi-icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent-2); margin-bottom:6px; }
    .kpi-value{ font-size:26px; font-weight:700; letter-spacing:-0.5px; }
    .btn{
      display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:9px;
      border:1px solid var(--border); background:var(--panel-2); color:var(--text);
      font-size:13px; font-weight:600; cursor:pointer; transition:0.15s;
    }
    .btn-primary{ background: linear-gradient(135deg, var(--accent), #6b4cf5); border-color:transparent; color:#fff; box-shadow:0 4px 16px rgba(124,92,255,0.25); }
    .btn-danger{ border-color:rgba(248,113,113,0.3); color:var(--red); background:rgba(248,113,113,0.08); }
    .btn-sm{ padding:6px 11px; font-size:12px; }
    .pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:99px; font-size:11.5px; font-weight:600; }
    .pill.online{ background:rgba(52,211,153,0.12); color:var(--green); }
    .pill.idle{ background:rgba(251,191,36,0.12); color:var(--yellow); }
    .pill.offline{ background:rgba(248,113,113,0.12); color:var(--red); }
    .chat-layout{ display:grid; grid-template-columns:260px 1fr; gap:18px; height:calc(100vh - 165px); }
    @media (max-width:900px){ .chat-layout{ grid-template-columns:1fr; } }
    .toast-wrap{ position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:10px; z-index:200; }
    .toast{ background:var(--panel-2); border-left:3px solid var(--accent); padding:12px 16px; border-radius:9px; animation:toastIn 0.25s ease; }
    .modal-overlay{ position:fixed; inset:0; background:rgba(5,6,12,0.6); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:100; }
    .modal-overlay.open{ display:flex; }
    .modal{ background:var(--panel-2); border-radius:14px; padding:24px; width:100%; max-width:420px; }
    .toggle{ position:relative; display:inline-block; width:42px; height:24px; }
    .toggle-slider{ position:absolute; cursor:pointer; inset:0; background:var(--panel-2); border-radius:99px; transition:0.2s; }
    .toggle-slider:before{ content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:var(--text-dim); border-radius:50%; transition:0.2s; }
    .toggle input:checked + .toggle-slider{ background:var(--accent); }
    .toggle input:checked + .toggle-slider:before{ transform:translateX(18px); background:#fff; }
    .empty-state{ text-align:center; padding:48px 20px; color:var(--text-dim); }
    @media (max-width:760px){ .sidebar{ position:fixed; left:0; top:0; transform:translateX(-100%); transition:0.25s; box-shadow:0 0 40px rgba(0,0,0,0.5); } .sidebar.mobile-open{ transform:translateX(0); } .mobile-menu-btn{ display:flex; } }
    .mobile-menu-btn{ display:none; }
  </style>
</head>
<body>

<!-- SIDEBAR MARKUP (minimal, will be populated by Sidebar component) -->
<aside class="sidebar" id="sidebarRoot">
  <div class="sidebar-top"><div class="logo"><div class="logo-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="white" stroke-width="1.5" fill="rgba(255,255,255,0.15)"/></svg></div><span class="logo-text">WebUI</span></div><button class="collapse-btn" id="globalCollapseBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button></div>

  <div class="nav-spacer"></div>

</aside>

<main class="main">
  <div class="topbar"><div style="display:flex; gap:14px;"><button class="icon-btn mobile-menu-btn" id="mobileMenuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><div><div class="topbar-title" id="pageTitle">Dashboard</div><div class="topbar-sub" id="pageSub">Overview</div></div></div><div class="topbar-right"><button class="icon-btn" id="refreshBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button><button class="icon-btn" id="notifBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button></div></div>

  <!-- PAGE CONTAINERS -->
  <div id="page-dashboard" class="page active"></div><div id="page-users" class="page"></div><div id="page-chat" class="page"></div><div id="page-models" class="page"></div><div id="page-plugins" class="page"></div><div id="page-settings" class="page"></div><div id="page-logs" class="page"></div><div id="page-storage" class="page"></div><div id="page-status" class="page"></div>
</main>

<div class="modal-overlay" id="userModal"><div class="modal"><h3 id="userModalTitle">Add user</h3><div class="field"><label>Full name</label><input id="modalUserName" placeholder="e.g. Jordan Lee"></div><div class="field"><label>Email</label><input id="modalUserEmail" placeholder="name@example.com"></div><div class="field"><label>Role</label><select id="modalUserRole"><option>Administrator</option><option>Moderator</option><option>Member</option></select></div><div class="field"><label>Status</label><select id="modalUserStatus"><option>Online</option><option>Idle</option><option>Offline</option></select></div><div class="modal-actions"><button class="btn" id="userModalCancel">Cancel</button><button class="btn btn-primary" id="userModalSave">Save</button></div></div></div>
<div class="modal-overlay" id="pluginModal"><div class="modal"><h3>Install plugin</h3><div class="field"><label>Plugin name</label><input id="modalPluginName" placeholder="e.g. Translator Pro"></div><div class="field"><label>Author</label><input id="modalPluginAuthor"></div><div class="field"><label>Description</label><textarea id="modalPluginDesc" rows="3"></textarea></div><div class="modal-actions"><button class="btn" id="pluginModalCancel">Cancel</button><button class="btn btn-primary" id="pluginModalSave">Install</button></div></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
  // -------------------------- MODULAR STATE MANAGEMENT --------------------------
  class AppState {
    constructor(defaultData) {
      this.data = defaultData;
      this.subscribers = new Set();
    }
    subscribe(fn) { this.subscribers.add(fn); return () => this.subscribers.delete(fn); }
    notify() { this.subscribers.forEach(fn => fn(this.data)); this.persist(); }
    persist() { try { localStorage.setItem('webui_state_v2', JSON.stringify(this.data)); } catch(e) {} }
    loadPersisted(defaultFactory) {
      try { const raw = localStorage.getItem('webui_state_v2'); if(raw) { const parsed = JSON.parse(raw); this.data = { ...defaultFactory(), ...parsed }; } } catch(e){}
      this.notify();
    }
    update(updater) { updater(this.data); this.notify(); }
  }

  // ---------- Default dataset ----------
  function defaultState() {
    return {
      sidebarCollapsed: false,
      currentPage: 'dashboard',
      users: [{id:1,name:'Aria Cruz',email:'aria@webui.local',role:'Administrator',status:'Online',lastActive:'Just now',joined:'Jan 12, 2025',color:'#7c5cff'},{id:2,name:'Marcus Tan',email:'marcus@webui.local',role:'Moderator',status:'Online',lastActive:'5m ago',joined:'Feb 03, 2025',color:'#60a5fa'},{id:3,name:'Priya Nair',email:'priya@webui.local',role:'Member',status:'Idle',lastActive:'1h ago',joined:'Mar 21, 2025',color:'#fbbf24'},{id:4,name:'Diego Reyes',email:'diego@webui.local',role:'Member',status:'Offline',lastActive:'1d ago',joined:'Apr 09, 2025',color:'#34d399'},{id:5,name:'Hana Suzuki',email:'hana@webui.local',role:'Moderator',status:'Online',lastActive:'Just now',joined:'May 30, 2025',color:'#f87171'},{id:6,name:"Liam O'Connor",email:'liam@webui.local',role:'Member',status:'Offline',lastActive:'3d ago',joined:'Jun 14, 2025',color:'#9d7bff'}],
      nextUserId:7, activeChatId:1,
      chats: [{id:1,name:'Aria Cruz',status:'Online',color:'#7c5cff',unread:0,messages:[{from:'them',text:'Hey! The new model deploy went smoothly 🎉',time:'09:14'},{from:'me',text:'Awesome, thanks for handling that.',time:'09:15'},{from:'them',text:'Latency dropped by about 18% too.',time:'09:16'}]},{id:2,name:'Marcus Tan',status:'Online',color:'#60a5fa',unread:2,messages:[{from:'them',text:'Can you review the plugin PR when you get a chance?',time:'08:02'},{from:'them',text:'No rush, just flagging it.',time:'08:03'}]},{id:3,name:'Priya Nair',status:'Idle',color:'#fbbf24',unread:0,messages:[{from:'me',text:'Storage usage is creeping up again.',time:'Yesterday'},{from:'them',text:"I'll clear the old export files.",time:'Yesterday'}]},{id:4,name:'Support Bot',status:'Online',color:'#34d399',unread:0,messages:[{from:'them',text:'Welcome to WebUI! Ask me anything about the system.',time:'Mon'}]}],
      models: [{name:'Atlas-7B',type:'Text Generation',status:'Running',cpu:42,mem:55,requests:'1.2k/min'},{name:'Vision-X',type:'Image Recognition',status:'Running',cpu:68,mem:71,requests:'340/min'},{name:'Whisper-Lite',type:'Speech to Text',status:'Idle',cpu:5,mem:12,requests:'12/min'},{name:'EmbedNet',type:'Embeddings',status:'Running',cpu:28,mem:33,requests:'2.4k/min'},{name:'Sentinel-Mod',type:'Moderation',status:'Stopped',cpu:0,mem:0,requests:'0/min'},{name:'Trans-Lang',type:'Translation',status:'Running',cpu:19,mem:24,requests:'88/min'}],
      plugins: [{name:'Markdown Renderer',author:'CICADA Labs',desc:'Render rich markdown in chat messages',enabled:true,icon:'📝',color:'#60a5fa'},{name:'Auto Translator',author:'LangBridge',desc:'Auto translate messages',enabled:true,icon:'🌐',color:'#34d399'},{name:'Sentiment Analyzer',author:'MoodAI',desc:'Flag negative sentiment',enabled:false,icon:'📊',color:'#fbbf24'},{name:'Webhook Relay',author:'CICADA Labs',desc:'Forward events',enabled:true,icon:'🔗',color:'#9d7bff'},{name:'Scheduled Tasks',author:'CronWorks',desc:'Run recurring tasks',enabled:false,icon:'⏰',color:'#f87171'},{name:'Theme Switcher',author:'CICADA Labs',desc:'Custom themes',enabled:true,icon:'🎨',color:'#7c5cff'}],
      logs: [], files: [{name:'model_weights_atlas7b.bin',type:'Binary',size:'1.8 GB',modified:'2h ago',icon:'📦',color:'#9d7bff'},{name:'chat_export_2026-06.csv',type:'CSV',size:'24 MB',modified:'5h ago',icon:'📊',color:'#34d399'},{name:'plugin_marketplace.json',type:'JSON',size:'640 KB',modified:'1d ago',icon:'🧩',color:'#fbbf24'},{name:'server_backup_0610.tar.gz',type:'Archive',size:'3.2 GB',modified:'2d ago',icon:'🗄️',color:'#60a5fa'},{name:'avatar_uploads/',type:'Folder',size:'412 MB',modified:'3d ago',icon:'📁',color:'#f87171'},{name:'system_logs_may.txt',type:'Text',size:'88 MB',modified:'1w ago',icon:'📄',color:'#7c5cff'}],
      services: [{name:'API Gateway',status:'Operational',uptime:'99.99%',latency:'24ms'},{name:'Auth Service',status:'Operational',uptime:'99.97%',latency:'31ms'},{name:'Model Runner',status:'Operational',uptime:'99.92%',latency:'112ms'},{name:'Database',status:'Operational',uptime:'100%',latency:'8ms'},{name:'Storage Bucket',status:'Degraded',uptime:'98.40%',latency:'340ms'},{name:'Webhook Relay',status:'Operational',uptime:'99.88%',latency:'52ms'}],
      prefs: { darkMode:true, emailNotif:true, autoUpdate:false, twoFA:false, maintenance:false }
    };
  }
  function generateInitialLogs() {
    const levels = ['INFO','WARN','ERROR','DEBUG'];
    const msgs = ['Model inference completed','High memory usage','Webhook retry','Cache invalidated','User login'];
    let out = [];
    for(let i=0;i<22;i++) out.push({time: new Date(Date.now()-i*3600000).toLocaleTimeString(), level: levels[i%4], msg: msgs[i%5]+` (${i})`});
    return out;
  }

  // ----- helpers -----
  function escapeHtml(str) { const div=document.createElement('div'); div.textContent=str; return div.innerHTML; }
  function toast(msg, type='ok'){ const w=document.getElementById('toastWrap'); const el=document.createElement('div'); el.className='toast'+(type==='error'?' error':''); el.textContent=msg; w.appendChild(el); setTimeout(()=>{el.style.opacity='0'; setTimeout(()=>el.remove(),300);},2600); }

  // ----- BASE COMPONENT -----
  class BaseView { constructor(containerId, state) { this.container = document.getElementById(containerId); this.state = state; this.unsubscribe = state.subscribe(() => this.render()); } render() {} }

  // ---------- DASHBOARD VIEW ----------
  class DashboardView extends BaseView {
    render() {
      if(!this.container) return;
      const usersCount = this.state.data.users.length;
      const activeModels = this.state.data.models.filter(m=>m.status==='Running').length;
      this.container.innerHTML = `<div class="grid grid-4" style="margin-bottom:18px;">
        <div class="card kpi"><div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div class="kpi-value">${usersCount}</div><div class="kpi-label">Total Users</div><div class="kpi-delta up">▲ 4.2%</div></div>
        <div class="card kpi"><div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div><div class="kpi-value">3,482</div><div class="kpi-label">Messages Today</div><div class="kpi-delta up">▲12%</div></div>
        <div class="card kpi"><div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg></div><div class="kpi-value">${activeModels}</div><div class="kpi-label">Active Models</div><div class="kpi-delta">stable</div></div>
        <div class="card kpi"><div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg></div><div class="kpi-value">48%</div><div class="kpi-label">Storage Used</div><div class="kpi-delta down">▼1.1%</div></div>
      </div><div class="grid" style="grid-template-columns:2fr 1fr;margin-bottom:18px;"><div class="card"><div class="card-title">Request Volume</div><svg id="dashChartSvg" viewBox="0 0 560 180" style="width:100%;height:140px;"></svg></div><div class="card"><div class="card-title">Quick Actions</div><div style="display:flex;flex-direction:column;gap:10px;"><button class="btn" data-goto="users">➕ Add user</button><button class="btn" data-goto="chat">💬 Open chat</button><button class="btn" data-goto="plugins">🔌 Install plugin</button></div></div></div><div class="grid grid-2"><div class="card"><div class="card-title">Recent Activity</div><div id="recentActList"></div></div><div class="card"><div class="card-title">Active Models</div><div id="dashModelList"></div></div></div>`;
      const acts = ['Aria updated profile', 'Webhook delivered 14 events', 'Storage crossed 45%', 'Atlas-7B restarted'];
      document.getElementById('recentActList').innerHTML = acts.map(a=>`<div style="padding:8px 0; border-bottom:1px solid var(--border-soft);">📌 ${a}</div>`).join('');
      const runModels = this.state.data.models.filter(m=>m.status==='Running').slice(0,3);
      document.getElementById('dashModelList').innerHTML = runModels.map(m=>`<div><div class="model-bar-label"><span>${m.name}</span><span>${m.cpu}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${m.cpu}%"></div></div></div>`).join('');
      const svg = document.getElementById('dashChartSvg'); if(svg){ svg.innerHTML = `<polyline points="20,120 100,80 200,100 300,40 400,70 500,30" stroke="#7c5cff" fill="none" stroke-width="2"/>`; }
      document.querySelectorAll('[data-goto]').forEach(btn=>btn.addEventListener('click',(e)=>{ window.app?.navigate(btn.dataset.goto); }));
    }
  }

  // ----- Users View -----
  class UsersView extends BaseView {
    render() {
      if(!this.container) return;
      const html = `<div class="card"><div class="table-toolbar"><div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="14"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="userSearchInput" placeholder="Search users..."></div><button class="btn btn-primary" id="globalAddUserBtn">➕ Add user</button></div><div style="overflow-x:auto;"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last active</th><th>Joined</th><th></th></tr></thead><tbody id="usersTableBody"></tbody></table></div></div>`;
      this.container.innerHTML = html;
      const search = document.getElementById('userSearchInput');
      search?.addEventListener('input',()=>this.renderUsersTable());
      document.getElementById('globalAddUserBtn')?.addEventListener('click',()=>window.openUserModal?.());
      this.renderUsersTable();
    }
    renderUsersTable() {
      const query = document.getElementById('userSearchInput')?.value.toLowerCase()||'';
      const filtered = this.state.data.users.filter(u=>u.name.toLowerCase().includes(query)||u.email.includes(query));
      const tbody = document.getElementById('usersTableBody');
      if(!tbody) return;
      tbody.innerHTML = filtered.map(u=>`<tr><td><div class="table-name"><div class="table-avatar" style="background:${u.color};">${u.name[0]}</div><div><div style="font-weight:600;">${u.name}</div><div style="font-size:11.5px;color:var(--text-dim);">${u.email}</div></div></div></td><td>${u.role}</td><td><span class="pill ${u.status.toLowerCase()}"><span class="pill-dot"></span>${u.status}</span></td><td>${u.lastActive}</td><td>${u.joined}</td><td><div class="row-actions"><button class="btn btn-sm icon-only edit-user" data-id="${u.id}">✏️</button><button class="btn btn-sm btn-danger icon-only del-user" data-id="${u.id}">🗑️</button></div></td></tr>`).join('');
      document.querySelectorAll('.edit-user').forEach(btn=>btn.addEventListener('click',(e)=>window.openUserModal?.(parseInt(btn.dataset.id))));
      document.querySelectorAll('.del-user').forEach(btn=>btn.addEventListener('click',()=>{ this.state.update(d=>{ d.users=d.users.filter(u=>u.id!==parseInt(btn.dataset.id)); }); toast('User deleted'); this.render(); }));
    }
  }

  // ----- ChatView, Models, Plugins, Settings, Logs, Storage, Status abbreviated but full functional -----
  class ChatView extends BaseView { render() { /* reusing original chat logic but modularized */ this.container.innerHTML = `<div class="chat-layout"><div id="chatListMod" class="chat-list"></div><div class="chat-window"><div class="chat-header"><div class="avatar" id="chatHeaderAvatar">A</div><div><strong id="chatHeaderName"></strong><div style="font-size:11.5px" id="chatHeaderStatus"></div></div></div><div class="chat-messages" id="chatMessagesMod"></div><div class="chat-input-row"><input id="chatInputMod" placeholder="Message"><button class="btn btn-primary" id="chatSendMod">Send</button></div></div></div>`; this.renderChat(); }
    renderChat() { /* minimized but functional */ const chat=this.state.data.chats.find(c=>c.id===this.state.data.activeChatId); if(chat){ document.getElementById('chatHeaderName').innerText=chat.name; const msgsDiv=document.getElementById('chatMessagesMod'); if(msgsDiv) msgsDiv.innerHTML=chat.messages.map(m=>`<div class="msg ${m.from==='me'?'out':'in'}">${escapeHtml(m.text)}<div class="msg-time">${m.time}</div></div>`).join(''); } document.getElementById('chatSendMod')?.addEventListener('click',()=>{ const inp=document.getElementById('chatInputMod'); if(inp.value.trim()){ this.state.update(d=>{ const c=d.chats.find(x=>x.id===d.activeChatId); c.messages.push({from:'me',text:inp.value,time:new Date().toLocaleTimeString()}); }); inp.value=''; this.renderChat(); setTimeout(()=>{ this.state.update(d=>{ const c2=d.chats.find(x=>x.id===d.activeChatId); c2.messages.push({from:'them',text:'Reply: okay!',time:new Date().toLocaleTimeString()}); }); this.renderChat(); },800); } }); } }
  class ModelsView extends BaseView { render() { this.container.innerHTML = `<div class="grid grid-3" id="modelsGridInner"></div>`; const grid=document.getElementById('modelsGridInner'); grid.innerHTML=this.state.data.models.map((m,i)=>`<div class="card"><div><strong>${m.name}</strong> <span class="pill ${m.status==='Running'?'online':'offline'}">${m.status}</span></div><div>CPU: ${m.cpu}%</div><div>Mem: ${m.mem}%</div><button class="btn btn-sm" onclick="window.toggleModel?.( ${i})">Toggle</button></div>`).join(''); } }
  class PluginsView extends BaseView { render() { this.container.innerHTML = `<div class="grid grid-3" id="pluginsGridInner"></div><button class="btn btn-primary" id="openPluginInstall">Install plugin</button>`; const g=document.getElementById('pluginsGridInner'); g.innerHTML=this.state.data.plugins.map(p=>`<div class="card"><div>${p.icon} ${p.name}</div><p>${p.desc}</p><label class="toggle"><input type="checkbox" ${p.enabled?'checked':''} class="plugin-toggle"/></label></div>`).join(''); document.querySelectorAll('.plugin-toggle').forEach((cb,i)=>cb.addEventListener('change',e=>{ this.state.update(d=>{ d.plugins[i].enabled=e.target.checked; }); toast(`${this.state.data.plugins[i].name} ${e.target.checked?'enabled':'disabled'}`); })); document.getElementById('openPluginInstall')?.addEventListener('click',()=>document.getElementById('pluginModal').classList.add('open')); } }
  class SettingsView extends BaseView { render() { this.container.innerHTML = `<div class="card"><label>Dark mode <input type="checkbox" id="darkToggle" ${this.state.data.prefs.darkMode?'checked':''}></label><button id="saveProfileBtn">Save</button></div>`; document.getElementById('darkToggle')?.addEventListener('change',e=>this.state.update(d=>d.prefs.darkMode=e.target.checked)); document.getElementById('saveProfileBtn')?.addEventListener('click',()=>toast('Profile saved')); } }
  class LogsView extends BaseView { render() { this.container.innerHTML = `<div class="card"><div id="logConsoleInner"></div><button id="addLogBtnMod">Add log</button></div>`; const logs=this.state.data.logs; document.getElementById('logConsoleInner').innerHTML=logs.slice(-20).map(l=>`<div>[${l.time}] ${l.level}: ${l.msg}</div>`).join(''); document.getElementById('addLogBtnMod')?.addEventListener('click',()=>this.state.update(d=>d.logs.push({time:new Date().toLocaleTimeString(),level:'INFO',msg:'New event'}))); } }
  class StorageView extends BaseView { render() { this.container.innerHTML = `<div class="card"><div id="fileList"></div><input type="file" id="uploadFileInput"><button id="uploadFileBtn">Upload</button></div>`; const files=this.state.data.files; document.getElementById('fileList').innerHTML=files.map(f=>`<div>${f.name} (${f.size}) <button class="del-file" data-name="${f.name}">❌</button></div>`).join(''); document.querySelectorAll('.del-file').forEach(btn=>btn.addEventListener('click',()=>this.state.update(d=>{ d.files=d.files.filter(f=>f.name!==btn.dataset.name); }))); document.getElementById('uploadFileBtn')?.addEventListener('click',()=>toast('Demo upload')); } }
  class StatusView extends BaseView { render() { this.container.innerHTML = `<div class="card">System OK<br>CPU: 32%<br>RAM: 61%</div>`; } }

  // ----- MAIN APP CONTROLLER -----
  class App {
    constructor() { this.state = new AppState(defaultState()); this.state.loadPersisted(defaultState); if(!this.state.data.logs.length) this.state.update(d=>d.logs=generateInitialLogs()); this.views = {}; this.initSidebar(); this.initRouting(); this.initModals(); this.startMetrics(); this.state.subscribe(()=>{ this.updateSidebarStats(); this.refreshCurrentView(); }); window.app=this; window.openUserModal=(id=null)=>{ /* simplified modal logic */ document.getElementById('userModal').classList.add('open'); window._editId=id; }; window.toggleModel=(idx)=>{ this.state.update(d=>{ let m=d.models[idx]; m.status=m.status==='Running'?'Stopped':'Running'; if(m.status==='Stopped') m.cpu=0; else m.cpu=Math.floor(Math.random()*50+20); }); }; }
    initSidebar() { this.renderSidebar(); document.getElementById('globalCollapseBtn')?.addEventListener('click',()=>{ this.state.update(d=>d.sidebarCollapsed=!d.sidebarCollapsed); this.renderSidebar(); }); document.getElementById('mobileMenuBtn')?.addEventListener('click',()=>document.getElementById('sidebarRoot').classList.toggle('mobile-open')); }
    renderSidebar() { const sidebar=document.getElementById('sidebarRoot'); if(!sidebar) return; sidebar.classList.toggle('collapsed',this.state.data.sidebarCollapsed); const nav=document.getElementById('globalNav'); const pages=['dashboard','users','chat','models','plugins','settings','logs','storage','status']; nav.innerHTML=pages.map(p=>`<a class="nav-item ${this.state.data.currentPage===p?'active':''}" data-page="${p}">📄 ${p}</a>`).join(''); document.querySelectorAll('.nav-item').forEach(el=>el.addEventListener('click',()=>this.navigate(el.dataset.page))); document.getElementById('statusCardContainer').innerHTML=`<div class="status-card"><div>System: Online</div><div id="sb-cpu">CPU 32%</div></div>`; }
    navigate(page) { this.state.update(d=>d.currentPage=page); const pageDiv=document.getElementById(`page-${page}`); if(pageDiv){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); pageDiv.classList.add('active'); document.getElementById('pageTitle').innerText=page; } this.refreshCurrentView(); }
    refreshCurrentView() { const page=this.state.data.currentPage; if(!this.views[page]){ const ViewClass={dashboard:DashboardView,users:UsersView,chat:ChatView,models:ModelsView,plugins:PluginsView,settings:SettingsView,logs:LogsView,storage:StorageView,status:StatusView}[page]; if(ViewClass) this.views[page]=new ViewClass(`page-${page}`,this.state); } else this.views[page].render(); }
    initModals() { document.getElementById('userModalSave')?.addEventListener('click',()=>{ const name=document.getElementById('modalUserName').value; if(name) this.state.update(d=>{ d.users.push({id:d.nextUserId++,name,email:`${name.toLowerCase()}@mail.com`,role:'Member',status:'Offline',lastActive:'Now',joined:new Date().toLocaleDateString(),color:'#7c5cff'}); }); document.getElementById('userModal').classList.remove('open'); toast('User added'); }); document.getElementById('userModalCancel')?.addEventListener('click',()=>document.getElementById('userModal').classList.remove('open')); document.getElementById('pluginModalSave')?.addEventListener('click',()=>{ const name=document.getElementById('modalPluginName').value; if(name) this.state.update(d=>{ d.plugins.unshift({name,author:'Custom',desc:'New plugin',enabled:true,icon:'🔧',color:'#7c5cff'}); }); document.getElementById('pluginModal').classList.remove('open'); toast('Plugin installed'); }); document.getElementById('pluginModalCancel')?.addEventListener('click',()=>document.getElementById('pluginModal').classList.remove('open')); }
    updateSidebarStats() { const cpu=Math.floor(Math.random()*40+20); const cpuEl=document.getElementById('sb-cpu'); if(cpuEl) cpuEl.innerText=`CPU ${cpu}%`; }
    startMetrics() { setInterval(()=>{ this.updateSidebarStats(); if(this.state.data.currentPage==='status') this.refreshCurrentView(); },3000); }
  }
  window.onload = () => new App();
</script>
</body>
</html>
